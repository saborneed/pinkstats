name: Deploy Shiny app to shinyapps.io
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3'   # or '4.4' if you prefer; match your app needs

    - name: Install R package dependencies (with system libs)
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          libssl-dev \
          libcurl4-openssl-dev \
          libxml2-dev \
          libgit2-dev \
          libssh-dev \
          libsodium-dev
        Rscript -e 'options(repos = c(CRAN = "https://cloud.r-project.org")); install.packages(c("rsconnect","shiny","shinyWidgets","shinyjqui","ggplot2"), dependencies = TRUE)'
      shell: bash
      
    - name: Deploy to shinyapps.io
      env:
        RSCONNECT_NAME: ${{ secrets.RSCONNECT_NAME }}
        RSCONNECT_TOKEN: ${{ secrets.RSCONNECT_TOKEN }}
        RSCONNECT_SECRET: ${{ secrets.RSCONNECT_SECRET }}
      run: |
        Rscript -e "rsconnect::setAccountInfo(name = Sys.getenv('RSCONNECT_NAME'), token = Sys.getenv('RSCONNECT_TOKEN'), secret = Sys.getenv('RSCONNECT_SECRET'))"
        Rscript -e "rsconnect::deployApp(appDir = '.', account = Sys.getenv('RSCONNECT_NAME'), forceUpdate = TRUE)"
      shell: bash
